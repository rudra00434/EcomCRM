{% load static %}

<style>
  .app-navbar {
    position: sticky;
    top: 0;
    z-index: 1040;
    background: rgba(16, 34, 56, 0.88);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    box-shadow: 0 16px 30px rgba(15, 23, 42, 0.08);
  }

  .app-brand {
    display: inline-flex;
    align-items: center;
    gap: 0.85rem;
    text-decoration: none;
  }

  .app-brand img {
    width: 52px;
    height: 52px;
    object-fit: contain;
    filter: drop-shadow(0 8px 18px rgba(255,255,255,0.08));
  }

  .brand-copy {
    display: flex;
    flex-direction: column;
    line-height: 1;
  }

  .brand-copy strong {
    color: #f8fafc;
    font-size: 1.05rem;
    letter-spacing: -0.03em;
    font-weight: 800;
  }

  .brand-copy span {
    color: rgba(226, 232, 240, 0.7);
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-top: 0.35rem;
  }

  .app-nav-link {
    position: relative;
    color: rgba(248, 250, 252, 0.82) !important;
    font-weight: 700;
    font-size: 0.92rem;
    padding: 0.65rem 1rem !important;
    border-radius: 999px;
    transition: color 0.22s ease, background 0.22s ease, transform 0.22s ease;
  }

  .app-nav-link:hover {
    color: #ffffff !important;
    background: rgba(255, 255, 255, 0.08);
    transform: translateY(-1px);
  }

  .app-nav-link.is-active {
    color: #ffffff !important;
    background: rgba(255, 255, 255, 0.12);
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
  }

  .app-nav-link.is-active::after {
    transform: scaleX(1);
  }

  .app-nav-link.accent-danger:hover,
  .app-nav-link.accent-danger {
    color: #fca5a5 !important;
  }

  .app-nav-link::after {
    content: '';
    position: absolute;
    left: 1rem;
    right: 1rem;
    bottom: 0.4rem;
    height: 2px;
    transform: scaleX(0);
    transform-origin: center;
    background: linear-gradient(90deg, #34d399, #f59e0b);
    border-radius: 999px;
    transition: transform 0.22s ease;
  }

  .app-nav-link:hover::after {
    transform: scaleX(1);
  }

  .navbar-toggler {
    border: none !important;
    box-shadow: none !important;
  }

  @media (max-width: 991.98px) {
    .app-nav-collapse {
      margin-top: 1rem;
      padding: 1rem;
      border-radius: 22px;
      background: rgba(11, 24, 39, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
  }
</style>

<nav class="navbar navbar-expand-lg app-navbar navbar-dark">
  <div class="container">
    <a class="app-brand" href="{% url 'home' %}">
      <img src="{% static 'image/CRM.png' %}" alt="EcomCRM Logo">
      <div class="brand-copy">
        <strong>EcomCRM</strong>
        <span>Operations Workspace</span>
      </div>
    </a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse justify-content-end app-nav-collapse" id="navbarNav">
      <ul class="navbar-nav gap-lg-2 align-items-lg-center">
        <li class="nav-item"><a class="nav-link app-nav-link {% if request.resolver_match.url_name == 'home' %}is-active{% endif %}" href="{% url 'home' %}">Dashboard</a></li>
        <li class="nav-item"><a class="nav-link app-nav-link {% if request.resolver_match.url_name == 'product' or request.resolver_match.url_name == 'add_product' or request.resolver_match.url_name == 'update_product' or request.resolver_match.url_name == 'delete_product' %}is-active{% endif %}" href="{% url 'product' %}">Products</a></li>
        <li class="nav-item"><a class="nav-link app-nav-link {% if request.resolver_match.url_name == 'tag_list' or request.resolver_match.url_name == 'import_tag_csv' %}is-active{% endif %}" href="{% url 'tag_list' %}">Tags</a></li>
        <li class="nav-item"><a class="nav-link app-nav-link {% if request.resolver_match.url_name == 'customer_list' or request.resolver_match.url_name == 'customer' or request.resolver_match.url_name == 'create_customer' or request.resolver_match.url_name == 'update_customer' or request.resolver_match.url_name == 'delete_customer' %}is-active{% endif %}" href="{% url 'customer_list' %}">Customers</a></li>
        <li class="nav-item"><a class="nav-link app-nav-link {% if request.resolver_match.url_name == 'order_list' or request.resolver_match.url_name == 'create_orders' or request.resolver_match.url_name == 'create_order' or request.resolver_match.url_name == 'update_order' or request.resolver_match.url_name == 'delete_order' %}is-active{% endif %}" href="{% url 'order_list' %}">Orders</a></li>
        <li class="nav-item"><a class="nav-link app-nav-link {% if request.resolver_match.url_name == 'analytics' %}is-active{% endif %}" href="{% url 'analytics' %}">Analytics</a></li>
        <li class="nav-item"><a class="nav-link app-nav-link {% if request.resolver_match.url_name == 'revenue' %}is-active{% endif %}" href="{% url 'revenue' %}">Revenue</a></li>
        <li class="nav-item"><a class="nav-link app-nav-link {% if request.resolver_match.url_name == 'ask_to_ai' %}is-active{% endif %}" href="{% url 'ask_to_ai' %}">ASK to AI</a></li>
        <li class="nav-item"><a class="nav-link app-nav-link {% if request.resolver_match.url_name == 'about' %}is-active{% endif %}" href="{% url 'about' %}">About</a></li>
        <li class="nav-item"><a class="nav-link app-nav-link {% if request.resolver_match.url_name == 'contact' %}is-active{% endif %}" href="{% url 'contact' %}">Contact</a></li>
        <li class="nav-item"><a class="nav-link app-nav-link accent-danger" href="{% url 'logout' %}">Logout</a></li>
      </ul>
    </div>
  </div>
</nav>
