<div class="row g-3 mb-4">
    <div class="col-md-3">
        <a href="{% url 'order_list' %}" class="text-decoration-none">
            <div class="surface-panel text-center p-4 h-100">
                <small class="d-block text-uppercase fw-bold mb-2" style="letter-spacing:0.08em;color:var(--ink-500);">Total Orders</small>
                <h2 class="fw-bold mb-0">{{ total_orders }}</h2>
            </div>
        </a>
    </div>

    <div class="col-md-3">
        <div class="surface-panel text-center p-4 h-100">
            <small class="d-block text-uppercase fw-bold mb-2" style="letter-spacing:0.08em;color:var(--ink-500);">Delivered</small>
            <h2 class="fw-bold mb-0">{{ delivered }}</h2>
        </div>
    </div>

    <div class="col-md-3">
        <div class="surface-panel text-center p-4 h-100">
            <small class="d-block text-uppercase fw-bold mb-2" style="letter-spacing:0.08em;color:var(--ink-500);">Out For Delivery</small>
            <h2 class="fw-bold mb-0">{{ out_for_delivery }}</h2>
        </div>
    </div>

    <div class="col-md-3">
        <div class="surface-panel text-center p-4 h-100">
            <small class="d-block text-uppercase fw-bold mb-2" style="letter-spacing:0.08em;color:var(--ink-500);">Pending</small>
            <h2 class="fw-bold mb-0">{{ pending }}</h2>
        </div>
    </div>
</div>
