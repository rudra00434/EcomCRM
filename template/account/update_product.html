{% extends 'main.html' %}
{% block content %}

<style>
    .product-preview {
        width: 100%;
        max-height: 260px;
        object-fit: contain;
        border-radius: 20px;
        border: 1px solid var(--line-soft);
        background: rgba(255,255,255,0.9);
        padding: 1rem;
        margin-bottom: 1rem;
    }
</style>

<div class="form-shell">
    <div class="form-card form-card--compact">
        <div class="form-header">
            <span class="eyebrow">Catalog Edit</span>
            <h2>Update Product</h2>
            <p>Refresh product details, tags, pricing, and media without changing your current backend behavior.</p>
        </div>

        {% if form.instance.pic %}
        <img class="product-preview" src="{{ form.instance.pic.url }}" alt="{{ form.instance.name }}">
        {% endif %}

        <form action="" method="POST" enctype="multipart/form-data" class="app-form">
            {% csrf_token %}
            {{ form.as_p }}

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Update Product</button>
                <a href="{% url 'product' %}" class="btn btn-light">Back to Products</a>
            </div>
        </form>
    </div>
</div>

{% endblock %}
