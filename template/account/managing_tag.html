{% extends 'main.html' %}
{% block content %}

<div class="form-shell">
    <div class="form-card form-card--narrow">
        <div class="form-header">
            <span class="eyebrow">Tag Import</span>
            <h2>Import Tag CSV</h2>
            <p>Upload a CSV file to create tags in bulk while keeping your current import behavior exactly the same.</p>
        </div>

        <form method="POST" enctype="multipart/form-data" class="app-form">
            {% csrf_token %}
            <div class="field-row">
                <label for="csv_file">CSV file</label>
                <input type="file" id="csv_file" name="csv_file" required>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Import CSV</button>
                <a href="{% url 'tag_list' %}" class="btn btn-light">Back to Tags</a>
            </div>
        </form>
    </div>
</div>

{% endblock %}
