{% extends 'main.html' %}
{% block content %}

<div class="confirm-shell">
    <div class="confirm-card">
        <div class="confirm-icon">
            <i class="fas fa-ban"></i>
        </div>
        <h2>Delete Order</h2>
        <p>You are about to remove this order record. The confirmation behavior stays the same, but the UI is now cleaner and less error-prone.</p>

        <div class="meta-box">
            <p class="mb-2"><strong>Order ID</strong> {{ orders.id }}</p>
            <p class="mb-0"><strong>Customer</strong> {{ orders.customer.name }}</p>
        </div>

        <form action="{% url 'delete_order' orders.id %}" method="post">
            {% csrf_token %}
            <div class="form-actions justify-content-center">
                <button type="submit" class="btn btn-danger">Delete Order</button>
                <a href="{% url 'home' %}" class="btn btn-light">Cancel</a>
            </div>
        </form>
    </div>
</div>

{% endblock %}
