{% extends 'main.html' %}
{% block content %}

<div class="confirm-shell">
    <div class="confirm-card">
        <div class="confirm-icon">
            <i class="fas fa-box-open"></i>
        </div>
        <h2>Delete Product</h2>
        <p>This removes the selected product from the catalog. The backend behavior is unchanged; only the confirmation experience is upgraded.</p>

        <div class="meta-box">
            <p class="mb-2"><strong>Product ID</strong> {{ products.id }}</p>
            <p class="mb-0"><strong>Name</strong> {{ products.name }}</p>
        </div>

        <form action="{% url 'delete_product' products.id %}" method="post">
            {% csrf_token %}
            <div class="form-actions justify-content-center">
                <button type="submit" class="btn btn-danger">Delete Product</button>
                <a href="{% url 'home' %}" class="btn btn-light">Cancel</a>
            </div>
        </form>
    </div>
</div>

{% endblock %}
