{% extends 'main.html' %}
{% block content %}

<div class="form-shell">
    <div class="form-card form-card--compact">
        <div class="form-header">
            <span class="eyebrow">Customer Edit</span>
            <h2>Update Customer</h2>
            <p>Edit customer identity, profile image, and location details while keeping the existing workflow untouched.</p>
        </div>

        <form action="" method="POST" enctype="multipart/form-data" class="app-form">
            {% csrf_token %}
            {{ form.as_p }}

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Update Customer</button>
                <a href="{% url 'customer_list' %}" class="btn btn-light">Back to Customers</a>
            </div>
        </form>
    </div>
</div>

{% endblock %}
